<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #error {
      display: none;
      padding: 24px;
      font-family: sans-serif;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="error">
    카카오맵 SDK를 불러오지 못했습니다. Kakao Developers에서 카카오맵 API 사용 설정과 JavaScript SDK 도메인을 확인해 주세요.
  </div>

  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7ef6a83d47352191ee3706ad4a5d96a4&autoload=false"
    onerror="document.getElementById('map').style.display='none'; document.getElementById('error').style.display='block';">
  </script>

  <script>
    if (window.kakao && kakao.maps) {
      kakao.maps.load(function () {
        const container = document.getElementById('map');

        const options = {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 3
        };

        const map = new kakao.maps.Map(container, options);

        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(37.5665, 126.9780)
        });

        marker.setMap(map);
      });
    } else {
      document.getElementById('map').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
